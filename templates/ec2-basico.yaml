AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Template basico para criacao de instancia EC2 - Lab DIO AWS CloudFormation.
  Provisiona uma instancia EC2 simples na VPC padrao com IP publico.

# ─────────────────────────────────────────────
# PARAMETROS — valores customizaveis no deploy
# ─────────────────────────────────────────────
Parameters:

  NomeAmbiente:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Ambiente de implantacao da instancia

  TipoInstancia:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
    Description: >
      Tipo da instancia EC2.
      t2.micro e elegivel ao Free Tier da AWS.

  ImagemAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: >
      AMI do Amazon Linux 2 obtida dinamicamente via SSM Parameter Store.
      Sempre busca a versao mais recente disponivel na regiao atual.

# ─────────────────────────────────────────────
# RECURSOS — o que sera criado na AWS
# ─────────────────────────────────────────────
Resources:

  InstanciaEC2Basica:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref TipoInstancia
      ImageId: !Ref ImagemAMI
      # Habilita atribuicao automatica de IP publico
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
      Tags:
        - Key: Name
          Value: !Sub "ec2-basico-${NomeAmbiente}"
        - Key: Environment
          Value: !Ref NomeAmbiente
        - Key: Project
          Value: lab-dio-cloudformation
        - Key: ManagedBy
          Value: CloudFormation

# ─────────────────────────────────────────────
# OUTPUTS — valores exportados apos a criacao
# ─────────────────────────────────────────────
Outputs:

  IDInstancia:
    Description: ID da instancia EC2 criada
    Value: !Ref InstanciaEC2Basica

  IPPublico:
    Description: Endereco IP publico da instancia
    Value: !GetAtt InstanciaEC2Basica.PublicIp

  DNSPublico:
    Description: DNS publico da instancia
    Value: !GetAtt InstanciaEC2Basica.PublicDnsName

  AmbienteDeployado:
    Description: Ambiente no qual a instancia foi criada
    Value: !Ref NomeAmbiente
